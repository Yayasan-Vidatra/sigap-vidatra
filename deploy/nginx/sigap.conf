# SIGAP Vidatra, Nginx (TOR Bagian 6, Rancangan r1 Bagian 9, NF-01, NF-02).
# Dipasang deploy/pasang.sh ke /etc/nginx/sites-available/sigap. Tanpa rahasia.
#
# Log akses untuk SEMUA jalur memakai format tanpa alamat IP, tanpa user agent, dan tanpa query string
# (query bisa memuat token tautan kata sandi atau tanda tangan unduhan). Log galat hanya tingkat emerg,
# karena pesan galat Nginx tingkat lain menyertakan "client: <IP>".

log_format sigap_tanpa_ip '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

# Jalur WBS dan CAPTCHA formulir WBS: PHP tidak pernah menerima IP asli (REMOTE_ADDR diganti 0.0.0.0).
# Jalur lain tetap meneruskan IP ke PHP hanya untuk pembatas laju di cache (di-hash, tidak disimpan bersama laporan).
map $request_uri $sigap_remote_addr {
    ~^/wbs(/|\?|$)     0.0.0.0;
    ~^/altcha/         0.0.0.0;
    default            $remote_addr;
}

# Header yang sudah dipasang aplikasi (misalnya Referrer-Policy no-referrer di /wbs) tidak ditimpa atau digandakan.
map $upstream_http_referrer_policy $sigap_referrer_policy {
    ''       strict-origin-when-cross-origin;
    default  '';
}

map $upstream_http_x_content_type_options $sigap_nosniff {
    ''       nosniff;
    default  '';
}

# Permintaan ke IP VPS atau nama lain: ditolak tanpa log.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /var/log/nginx/sigap-error.log emerg;
    return 444;
}

# HTTP dialihkan ke HTTPS; jalur ACME untuk perpanjangan Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name sigap.vidatra.sch.id;
    access_log /var/log/nginx/sigap-access.log sigap_tanpa_ip;
    error_log /var/log/nginx/sigap-error.log emerg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sigap.vidatra.sch.id;

    root /var/www/sigap/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/sigap-access.log sigap_tanpa_ip;
    error_log /var/log/nginx/sigap-error.log emerg;

    ssl_certificate /etc/letsencrypt/live/sigap.vidatra.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigap.vidatra.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SIGAP_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Potongan unggahan lampiran 5 MB; unggahan panel Filament (Livewire) sampai 12 MB.
    client_max_body_size 20m;

    # Header keamanan untuk semua jawaban. CSP ketat dipasang aplikasi di /wbs* (LindungiJalurWbs).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options $sigap_nosniff always;
    add_header Referrer-Policy $sigap_referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Berkas tersembunyi (.env, .git) tidak pernah disajikan.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Aset Vite bernama hash: boleh di-cache lama. Tanpa add_header di sini agar header keamanan server tetap berlaku.
    location ^~ /build/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hanya public/index.php yang dijalankan PHP; berkas .php lain tidak pernah dieksekusi.
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm-sigap.sock;
        include /etc/nginx/snippets/fastcgi-sigap.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
