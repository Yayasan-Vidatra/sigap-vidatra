; SIGAP Vidatra, worker antrean (notifikasi surel, pemindaian dan pembersihan lampiran, detak antrean).
; Dipasang deploy/pasang.sh ke /etc/supervisor/conf.d/sigap-antrean.conf.
; --timeout=600 untuk pemrosesan video 100 MB; harus lebih kecil dari retry_after (config/queue.php, 660).

[program:sigap-antrean]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/sigap/artisan queue:work database --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/var/www/sigap
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sigap-antrean.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
