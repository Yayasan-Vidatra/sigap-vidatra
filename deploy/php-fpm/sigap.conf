; SIGAP Vidatra, pool PHP-FPM. Dipasang deploy/pasang.sh ke /etc/php/8.3/fpm/pool.d/sigap.conf.
; access.log sengaja TIDAK diisi: log akses FPM mencatat REMOTE_ADDR (NF-02). Log galat PHP tidak memuat IP.

[sigap]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-sigap.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

catch_workers_output = no
clear_env = yes

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php/sigap-fpm-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
